name: CI — Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 8am UTC (1am PDT) — Lighthouse + link check
    - cron: '0 8 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Playwright Tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run tests
        run: npx playwright test

      - name: Upload test results
        # Only runs when a test fails — test-results/ is empty on green runs,
        # which otherwise logged a "No files were found" warning every push.
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse Audit
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Wait for Pages deploy
        run: sleep 30

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://luxiga.co/
            https://luxiga.co/pulse.html
            https://luxiga.co/case-studies/solobill.html
          uploadArtifacts: true
          temporaryPublicStorage: true

  lighthouse-scheduled:
    name: Lighthouse Audit (Scheduled)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://luxiga.co/
            https://luxiga.co/pulse.html
            https://luxiga.co/case-studies/solobill.html
          uploadArtifacts: true
          temporaryPublicStorage: true

  links:
    name: Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root-dir .
            --exclude 'formspree.io'
            --exclude 'calendly.com'
            --exclude 'linkedin.com'
            --exclude 'mailto:'
            '*.html'
            'case-studies/*.html'
          fail: true

  deploy:
    name: Deploy to Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # SECURITY: this repo is PUBLIC and this job publishes whatever it uploads
      # to https://luxiga.co/<path>. The `exclude:` list in _config.yml does NOT
      # protect anything here, because upload-pages-artifact bypasses the Jekyll
      # build entirely. Prune explicitly instead.
      - name: Strip non-public paths before publishing
        run: |
          set -euxo pipefail
          # WIDENED 2026-08-05. The old list missed docs/, and every file in it
          # was serving at 200 on the live site. docs/LUXIGA_DISCOVERY_PLAYBOOK.md
          # published the internal pricing method ("half their pain saved = price
          # they'll accept") and named Justin twice, on the vendor domain, to any
          # prospect who guessed the URL. Add to this list, never shorten it.
          rm -rf infrastructure .github tests docs scripts
          rm -f SESSION.md README.md package.json package-lock.json playwright.config.js
          rm -f "Idea rambling.moved-to-voicememo"
          # Refuse to publish if anything sensitive survived the prune. This list
          # must match the one above. A prune that silently no-ops looks exactly
          # like a prune that worked.
          for p in infrastructure .github tests docs scripts SESSION.md README.md \
                   package.json package-lock.json playwright.config.js \
                   "Idea rambling.moved-to-voicememo"; do
            if [ -e "$p" ]; then
              echo "::error::Non-public path '$p' survived the prune, refusing to publish"
              exit 1
            fi
          done

      # ADDED 2026-08-05. The check above is tautological: it re-tests only the
      # paths the line above it just deleted, so it can confirm a delete worked
      # and can NEVER catch a sensitive file nobody thought to add to the list.
      # That is how docs/ shipped. This step scans what is ACTUALLY about to be
      # uploaded, by shape rather than by name, so a new file is caught on its
      # first deploy instead of on the next audit.
      - name: Scan the artifact for anything that should not be public
        run: |
          set -uo pipefail
          fail=0

          # Filenames by shape.
          # The internal-doc terms are anchored to .md ON PURPOSE. A dry run of an
          # earlier draft matched audit/index.html, which is the public Pulse tool,
          # and would have blocked every deploy. Scope beats zeal: a guard that
          # cries wolf gets disabled, and a disabled guard protects nothing.
          BADNAME='articles.?of.?organization|operating.?agreement|\.env($|\.)|\.p12$|\.pem$|\.pfx$|id_rsa|credentials|liability|tcpa|dealmachine|owner.?list|homeowner|skip.?trace|\.prproj$|\.aep$|\.psd$|discharge.?summary|polygraph|(SESSION|HANDOFF|WORKLIST|AUDIT|BACKLOG|TODO|NEXT|RETAINER|PETITION)[A-Za-z0-9_-]*\.md$'
          hits="$(find . -type f -not -path './.git/*' | grep -iE "$BADNAME" || true)"
          if [ -n "$hits" ]; then
            echo "::error::sensitive-looking filename(s) in the publish artifact:"
            echo "$hits"; fail=1
          fi

          # Internal-only docs that are not part of the site. Any markdown outside
          # an explicitly public folder is suspect on a marketing site.
          stray="$(find . -maxdepth 2 -name '*.md' -not -path './.git/*' \
                   -not -path './case-studies/*' -not -path './research/*' || true)"
          if [ -n "$stray" ]; then
            echo "::error::unexpected markdown in the publish artifact:"
            echo "$stray"; fail=1
          fi

          # Secret shapes in content. Same classes as scripts/publish-guard.sh.
          SECRET='re_[A-Za-z0-9_]{16,}|sk-ant-[A-Za-z0-9_-]{20,}|sk-proj-[A-Za-z0-9_-]{20,}|sk_live_[A-Za-z0-9]{16,}|AIza[0-9A-Za-z_-]{30,}|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}|xox[baprs]-[A-Za-z0-9-]{10,}|AKIA[0-9A-Z]{16}|SG\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}|BEGIN [A-Z ]*PRIVATE KEY'
          if grep -rIlE "$SECRET" . --exclude-dir=.git >/dev/null 2>&1; then
            echo "::error::possible secret in the publish artifact:"
            grep -rIlE "$SECRET" . --exclude-dir=.git | head -10
            fail=1
          fi

          # Prove the scanner itself works. An empty result from a broken grep
          # looks exactly like safety, so plant a control and require a hit.
          # Assembled from parts on purpose. Written as one literal it is itself a
          # key-shaped string in a PUBLIC repo, and publish-guard blocked this very
          # push over it. Correct outcome, so the fix is to stop shipping the shape,
          # not to weaken the scanner. The runtime value is identical.
          printf '%s%s\n' 'AKIA' '0123456789ABCDEF' > .__guard_control
          if ! grep -qE "$SECRET" .__guard_control; then
            echo "::error::the secret scanner did not match its own control string. Scan is broken."
            fail=1
          fi
          rm -f .__guard_control

          [ "$fail" -eq 0 ] || exit 1
          echo "artifact scan clean (and the scanner was validated against a control)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
