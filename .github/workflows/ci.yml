name: CI — Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 8am UTC (1am PDT) — Lighthouse + link check
    - cron: '0 8 * * 1'

# Least privilege: every job reads only. The deploy job alone gets Pages rights.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Playwright Tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium webkit --with-deps

      - name: Run tests
        run: npx playwright test

      - name: Upload test results
        # Only runs when a test fails — test-results/ is empty on green runs,
        # which otherwise logged a "No files were found" warning every push.
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse Audit
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Wait for Pages deploy
        run: sleep 30

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://luxiga.co/
            https://luxiga.co/audit/
            https://luxiga.co/case-studies/solobill.html
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  lighthouse-scheduled:
    name: Lighthouse Audit (Scheduled)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://luxiga.co/
            https://luxiga.co/audit/
            https://luxiga.co/case-studies/solobill.html
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  links:
    name: Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root-dir .
            --exclude 'formspree.io'
            --exclude 'calendly.com'
            --exclude 'linkedin.com'
            --exclude 'mailto:'
            --exclude '^https://luxiga\.co'
            --exclude-path node_modules
            --exclude-path test-results
            '**/*.html'
          fail: true

  deploy:
    name: Deploy to Pages
    needs: [test, links]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # SECURITY: this repo is PUBLIC and this job publishes whatever it uploads
      # to https://luxiga.co/<path>. The `exclude:` list in _config.yml does NOT
      # protect anything here, because upload-pages-artifact bypasses the Jekyll
      # build entirely. Prune explicitly instead.
      - name: Strip non-public paths before publishing
        run: |
          set -euxo pipefail
          # WIDENED 2026-08-05. The old list missed docs/, and every file in it
          # was serving at 200 on the live site, including an internal sales
          # document. Add to this list, never shorten it.
          rm -rf infrastructure .github tests docs scripts
          rm -f SESSION.md README.md package.json package-lock.json playwright.config.js
          rm -f "Idea rambling.moved-to-voicememo"
          # WIDENED 2026-10-13. Repo config files served at 200 on the live site.
          rm -f _config.yml .gitignore lighthouserc.json
          # WIDENED 2026-09-05. Every path above is top-level, so the prune could
          # not reach a nested one. CASSANDRA found that card/resume/src/ and
          # card/resume/README.md would have published the build script (with a
          # /Users/lukasgreen path in it), the source HTML, and a note naming a
          # client engagement, at https://luxiga.co/card/resume/src/. That source
          # now lives in the private forge at business/resume-build/. These two
          # lines are the tripwire if it ever comes back. NESTED PATHS BELONG HERE
          # TOO, not just top-level ones.
          rm -rf card/resume/src
          rm -f card/resume/README.md
          # Refuse to publish if anything sensitive survived the prune. This list
          # must match the one above. A prune that silently no-ops looks exactly
          # like a prune that worked.
          for p in infrastructure .github tests docs scripts SESSION.md README.md \
                   package.json package-lock.json playwright.config.js \
                   card/resume/src card/resume/README.md _config.yml .gitignore lighthouserc.json \
                   "Idea rambling.moved-to-voicememo"; do
            if [ -e "$p" ]; then
              echo "::error::Non-public path '$p' survived the prune, refusing to publish"
              exit 1
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
