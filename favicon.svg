<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="LUXIGA">
  <title>LUXIGA</title>
  <desc>The lit X: design (lime) crosses technology (violet). Same mark as the wordmark X.</desc>
  <defs>
    <filter id="lx-soft" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <radialGradient id="lx-halo" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#C4FF53" stop-opacity="0.12"/>
      <stop offset="45%" stop-color="#8B5CF6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="116" fill="#0D0D1A"/>
  <rect x="1" y="1" width="510" height="510" rx="115" fill="none" stroke="#20203a" stroke-width="2"/>
  <rect width="512" height="512" rx="116" fill="url(#lx-halo)"/>

  <!-- subtle glow behind the blades (kept low so it stays crisp at 16px) -->
  <g filter="url(#lx-soft)" opacity="0.3">
    <path d="M84,84 L216,84 L428,428 L296,428 Z" fill="#C4FF53"/>
    <path d="M296,84 L428,84 L216,428 L84,428 Z" fill="#8B5CF6"/>
  </g>

  <!-- violet blade: technology -->
  <path d="M296,84 L428,84 L216,428 L84,428 Z" fill="#8B5CF6"/>
  <!-- lime blade: design (on top at the crossing) -->
  <path d="M84,84 L216,84 L428,428 L296,428 Z" fill="#C4FF53"/>
</svg>
