name = "luxiga-card"
main = "worker.js"
compatibility_date = "2026-07-01"

# Non-secret config. Override here if your Airtable tables / sender differ.
[vars]
AIRTABLE_LEADS_TABLE = "Leads"
AIRTABLE_EVENTS_TABLE = "Events"
FROM_EMAIL = "leads@luxiga.co"
ALLOW_ORIGIN = "https://luxiga.co"

# Secrets are NOT stored here. Set them with `wrangler secret put <NAME>`:
#   AIRTABLE_TOKEN   Airtable personal access token (scope: data.records:read+write on the base)
#   AIRTABLE_BASE    Airtable base id (starts with "app...")
#   RESEND_KEY       Resend API key (reuse the GGC one or make a new one)
#   NOTIFY_EMAIL     where new-lead emails go (e.g. lukas@lukasdgreen.com)
#   DASH_TOKEN       any long random string; unlocks the /dashboard
