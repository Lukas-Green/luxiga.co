<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="LUXIGA">
  <title>LUXIGA</title>
  <defs>
    <filter id="lx-at-soft" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <radialGradient id="lx-at-halo" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#C4FF53" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#8B5CF6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- iOS applies its own mask; fill full rect -->
  <rect width="180" height="180" fill="#0D0D1A"/>
  <rect width="180" height="180" fill="url(#lx-at-halo)"/>

  <g filter="url(#lx-at-soft)" opacity="0.5">
    <path d="M34,34 L76,34 L146,146 L104,146 Z" fill="#C4FF53"/>
    <path d="M104,34 L146,34 L76,146 L34,146 Z" fill="#8B5CF6"/>
  </g>

  <!-- violet blade: technology -->
  <path d="M104,34 L146,34 L76,146 L34,146 Z" fill="#8B5CF6"/>
  <!-- lime blade: design -->
  <path d="M34,34 L76,34 L146,146 L104,146 Z" fill="#C4FF53"/>
</svg>
