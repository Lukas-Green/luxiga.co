<style>
  :root{--bg:#080810;--panel:#11111c;--line:rgba(196,255,83,.14);--ink:#f0f1ea;--muted:#8f9a78;--lime:#C4FF53;--lime-ink:#0a0a0a}
  *{box-sizing:border-box} html,body{margin:0}
  body{background:radial-gradient(120% 80% at 50% -8%,rgba(196,255,83,.09),transparent 60%),var(--bg);
    color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;
    min-height:100svh;padding:26px 18px 44px}
  main{max-width:400px;margin:0 auto;display:flex;flex-direction:column;align-items:stretch;gap:16px}
  /* flip card */
  .flip{perspective:1400px;cursor:pointer}
  .flip-in{position:relative;width:100%;aspect-ratio:252/144;transition:transform .6s cubic-bezier(.4,.15,.2,1);
    transform-style:preserve-3d}
  .flip.flipped .flip-in{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;overflow:hidden;
    box-shadow:0 20px 46px -22px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.2);border:1px solid var(--line)}
  .face svg{display:block;width:100%;height:100%}
  .back{transform:rotateY(180deg)}
  .flip-hint{display:flex;align-items:center;justify-content:center;gap:7px;color:var(--muted);
    font-size:12px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;margin-top:-4px}
  .flip-hint svg{width:14px;height:14px}
  /* actions */
  .actions{display:flex;flex-direction:column;gap:10px;margin-top:2px}
  a.btn,button.btn{display:flex;align-items:center;gap:13px;width:100%;padding:15px 18px;border-radius:13px;
    text-decoration:none;font:inherit;font-size:15px;font-weight:600;cursor:pointer;
    border:1px solid var(--line);background:var(--panel);color:var(--ink);transition:.12s}
  a.btn:active,button.btn:active{transform:scale(.99)}
  a.btn:hover,button.btn:hover{border-color:rgba(196,255,83,.4)}
  .btn:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
  a.primary{background:var(--lime);color:var(--lime-ink);border-color:var(--lime);justify-content:center;font-size:16px;padding:17px}
  .ic{width:20px;height:20px;flex:0 0 20px;color:var(--lime)} .ic svg{width:100%;height:100%}
  a.primary .ic{color:var(--lime-ink)}
  .sub{margin-left:auto;color:var(--muted);font-weight:500;font-size:12.5px}
  /* work request */
  details.req{border:1px solid var(--line);border-radius:13px;background:var(--panel);overflow:hidden;margin-top:4px}
  details.req summary{list-style:none;cursor:pointer;padding:15px 18px;display:flex;align-items:center;gap:13px;
    font-weight:600;font-size:15px}
  details.req summary::-webkit-details-marker{display:none}
  details.req summary .chev{margin-left:auto;color:var(--muted);transition:.2s}
  details.req[open] summary .chev{transform:rotate(90deg)}
  form{padding:2px 18px 18px;display:flex;flex-direction:column;gap:10px}
  label{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:-4px}
  input,textarea{font:inherit;font-size:15px;color:var(--ink);background:#0c0c16;border:1px solid var(--line);
    border-radius:10px;padding:12px 13px;width:100%}
  input:focus,textarea:focus{outline:none;border-color:var(--lime)}
  textarea{resize:vertical;min-height:76px}
  form button{margin-top:4px}
  .thanks{padding:16px 18px 20px;color:var(--lime);font-weight:600;display:none}
  footer{margin-top:14px;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);text-align:center;font-weight:600}
</style>
</head>

    if(!v){ v=Math.abs((Date.now()^(performance.now()*1000))|0).toString(36)+Math.floor(1e6*(1+((performance.now()%1)))).toString(36); localStorage.setItem(k,v);} return v; }catch(e){ return "anon"; }})();
  function track(event, meta){
    var payload = { event: event, source: source, sid: sid, path: location.pathname, ts: Date.now(), meta: meta||{} };
    try{ (window.__lxq=window.__lxq||[]).push(payload); }catch(e){}
    if(TRACK_ENDPOINT){ try{ navigator.sendBeacon(TRACK_ENDPOINT, JSON.stringify(payload)); }catch(e){} }
  }
  track("view");

  var flip=document.getElementById("flip");
  function doFlip(){ flip.classList.toggle("flipped"); track("flip",{side: flip.classList.contains("flipped")?"back":"front"}); }
  flip.addEventListener("click",doFlip);
  flip.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); doFlip(); }});

  ["save","call","email","visit"].forEach(function(id){
    var el=document.getElementById(id);
    if(el) el.addEventListener("click",function(){ track("click",{action:id}); });
  });
  document.getElementById("req").addEventListener("toggle",function(e){ if(e.target.open) track("open_request"); });

  // --- work request submit. Phase 1: mailto (reaches inbox now). Phase 2: POST to Worker -> Airtable + email. ---
  var LEAD_ENDPOINT = API ? API + "/lead" : "";
  var form=document.getElementById("leadForm"), thanks=document.getElementById("thanks");
  form.addEventListener("submit",function(e){
    e.preventDefault();
    var name=form.name.value.trim(), contact=form.contact.value.trim(), message=form.message.value.trim();
    if(!name||!contact||!message){ form.reportValidity&&form.reportValidity(); return; }
    track("lead_submit",{via: LEAD_ENDPOINT?"server":"mailto"});
    if(LEAD_ENDPOINT){
      fetch(LEAD_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({name:name,contact:contact,message:message,source:source,sid:sid})})
        .finally(function(){ form.style.display="none"; thanks.style.display="block"; });
    } else {
      var subj=encodeURIComponent("Work request from "+name+" (via card"+(source!=="direct"?" / "+source:"")+")");
      var body=encodeURIComponent("Name: "+name+"\nContact: "+contact+"\nSource: "+source+"\n\n"+message);
      window.location.href="mailto:lukas@luxiga.co?subject="+subj+"&body="+body;
      form.style.display="none"; thanks.style.display="block";
    }
  });
})();
</script>
</body>
