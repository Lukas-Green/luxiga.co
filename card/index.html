  :root{

  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:

    color:var(--ink);

    -webkit-font-smoothing:antialiased;
    min-height:100svh;
    display:flex; align-items:center; justify-content:center;
    padding:28px 20px;
  }
  .card{
    width:100%; max-width:400px;
    display:flex; flex-direction:column; align-items:center; gap:0;
  }
  .mark{width:150px; height:auto; margin-bottom:26px}
  .mark svg{display:block; width:100%; height:auto}
  h1{
    font-size:34px; line-height:1.05; font-weight:650; letter-spacing:-.5px;
    margin:0 0 8px; text-align:center;
  }
  h1 .g{color:var(--lime)}
  .role{
    font-size:12px; letter-spacing:3px; font-weight:700; text-transform:uppercase;
    color:var(--muted); text-align:center; margin:0 0 26px;
  }
  .actions{width:100%; display:flex; flex-direction:column; gap:11px}
  a.btn{
    display:flex; align-items:center; gap:13px;
    width:100%; padding:15px 18px; border-radius:14px;
    text-decoration:none; font-size:15.5px; font-weight:600;
    border:1px solid var(--line); background:var(--panel); color:var(--ink);
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
  }
  a.btn:active{transform:scale(.985)}
  a.btn:hover{border-color:rgba(196,255,83,.4)}
  a.btn:focus-visible{outline:2px solid var(--lime); outline-offset:2px}
  a.primary{background:var(--lime); color:var(--lime-ink); border-color:var(--lime); justify-content:center; font-size:16.5px; padding:17px}
  a.primary .ic{color:var(--lime-ink)}
  .ic{width:20px; height:20px; flex:0 0 20px; color:var(--lime)}
  .ic svg{display:block; width:100%; height:100%}
  .sub{color:var(--muted); font-weight:500; font-size:13px; margin-left:auto}
  footer{
    margin-top:30px; font-size:11px; letter-spacing:3.5px; text-transform:uppercase;
    color:var(--muted); text-align:center; font-weight:600;
  }
  @media (max-width:360px){ h1{font-size:30px} .mark{width:132px} }
